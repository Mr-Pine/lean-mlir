[package]
name = "solana-ed25519"
version = "0.2.4"
edition = "2024"
build = "build.rs"
[lib]
name = "solana_ed25519"
path = "src/lib.rs"
[features]
alloc = ["zeroize/alloc"]
precomputed-tables = []
zeroize = []
rand_core = []
digest = []
[dependencies]
cfg-if = "=1.0.5"
digest = { version = "=0.11.3", default-features = false }
ed25519 = { version = "=2.2.3", default-features = false }
hashbrown = "=0.15.1"
rand = { version = "=0.10.2", features = ["sys_rng"], default-features = false }
rand_core = { version = "=0.10.1", default-features = false }
sha2 = { version = "=0.11.0", default-features = false }
subtle = { version = "=2.6.1", features = ["const-generics"], default-features = false }
zeroize = { version = "=1.8.2", default-features = false }
[build-dependencies]
rustc_version = "=0.4.1"
[target.'cfg(all(target_arch = "x86_64", not(curve25519_backend = "serial")))'.dependencies]
cpufeatures = "=0.3.0"
curve25519-dalek-derive = "=0.1.1"
[profile.release]
opt-level = 3
panic = "abort"
codegen-units = 1
debug-assertions = false
overflow-checks = false
