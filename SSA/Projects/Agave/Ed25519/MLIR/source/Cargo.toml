[package]
edition = "2024"
rust-version = "1.85.0"
name = "solana-ed25519"
version = "0.2.4"
authors = [
    "Isis Lovecruft <isis@patternsinthevoid.net>",
    "Henry de Valence <hdevalence@hdevalence.ca>",
    "Anza Maintainers <maintainers@anza.xyz>",
]
build = "build.rs"
exclude = [
    "**/.gitignore",
    ".gitignore",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A pure-Rust implementation of group operations on ristretto255 and Curve25519, with HEEA scalar decomposition (forked from curve25519-dalek)"
homepage = "https://anza.xyz/"
readme = "README.md"
keywords = [
    "cryptography",
    "crypto",
    "ristretto",
    "curve25519",
    "ristretto255",
]
categories = [
    "cryptography",
    "no-std",
]
license = "BSD-3-Clause"
repository = "https://github.com/anza-xyz/cryptography"
resolver = "2"

[package.metadata.docs.rs]
rustdoc-args = [
    "--html-in-header",
    "docs/assets/rustdoc-include-katex-header.html",
    "--cfg",
    "docsrs",
]
all-features = true

[features]
alloc = ["zeroize?/alloc"]
default = [
    "alloc",
    "precomputed-tables",
    "zeroize",
    "rand_core",
    "digest",
]
digest = ["dep:digest"]
group = [
    "dep:group",
    "rand_core",
]
group-bits = [
    "group",
    "ff/bits",
]
legacy_compatibility = []
lizard = ["digest"]
pem = [
    "pkcs8",
    "dep:der",
    "ed25519/pem",
    "zeroize",
]
pkcs8 = [
    "dep:pkcs8",
    "pkcs8/alloc",
    "ed25519/pkcs8",
    "alloc",
]
precomputed-tables = []
rand_core = [
    "dep:rand_core",
    "dep:rand",
]
serde = [
    "dep:serde",
    "serde/derive",
]
std = ["alloc"]

[lib]
name = "solana_ed25519"
path = "src/lib.rs"

[[bench]]
name = "bench"
path = "benches/bench.rs"

[[bench]]
name = "dalek_benchmarks"
path = "benches/dalek_benchmarks.rs"
harness = false
required-features = [
    "alloc",
    "digest",
    "group",
    "rand_core",
]

[dependencies.cfg-if]
version = "1"

[dependencies.der]
version = "0.7.9"
optional = true

[dependencies.digest]
version = "0.11.0"
optional = true
