[dependencies.zeroize]
version = "1"
optional = true
default-features = false

[dev-dependencies.bincode]
version = "1"

[dev-dependencies.color-eyre]
version = "0.6"

[dev-dependencies.criterion]
version = "0.8"

[dev-dependencies.ed25519-dalek]
version = "2.2.0"

[dev-dependencies.hex]
