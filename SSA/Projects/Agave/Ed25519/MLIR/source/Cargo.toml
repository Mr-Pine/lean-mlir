[dependencies.ff]
version = "0.14.0"
optional = true
default-features = false

[dependencies.group]
version = "0.14.0"
optional = true
default-features = false

[dependencies.hashbrown]
version = "0.15"

[dependencies.pkcs8]
version = "0.10.1"
optional = true

[dependencies.rand]
version = "0.10.2"
features = ["sys_rng"]
optional = true
default-features = false

[dependencies.rand_core]
version = "0.10.1"
optional = true
default-features = false

[dependencies.serde]
version = "1.0"
optional = true
default-features = false

[dependencies.sha2]
version = "0.11.0"
default-features = false

[dependencies.subtle]
version = "2.6.0"
