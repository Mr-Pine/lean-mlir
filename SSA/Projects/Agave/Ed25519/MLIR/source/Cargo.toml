version = "0.4.0"

[target.'cfg(all(target_arch = "x86_64", not(curve25519_backend = "serial")))'.dependencies.cpufeatures]
version = "0.3.0"

[target.'cfg(all(target_arch = "x86_64", not(curve25519_backend = "serial")))'.dependencies.curve25519-dalek-derive]
version = "0.1.1"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = [
    "cfg(allow_unused_unsafe)",
    'cfg(curve25519_backend, values("simd", "serial"))',
    'cfg(curve25519_diagnostics, values("build"))',
    'cfg(curve25519_bits, values("64"))',
]
